# The lab: a legacy title, a Nakama to migrate into, and the importer between them.
#
# Everything here is on purpose. The fake title is a separate service over HTTP, because that is what
# a legacy backend is - something across a network that pages, rate limits and occasionally fails.
# The Nakama image is built from runtime/Dockerfile rather than pulled, because the plugin has to be
# built by the toolchain that built the server and a pulled image cannot guarantee that.
name: nakama-migration-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: localdb
      POSTGRES_DB: nakama
    volumes:
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check: without it pg_isready answers over the unix socket, which
      # during initdb belongs to a temporary server that is not listening on TCP yet, and the next
      # service to start fails with a connection refused that looks unrelated.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d nakama"]
      interval: 2s
      timeout: 3s
      retries: 30

  faketenant:
    build: .
    entrypoint: ["/faketenant"]
    # LAB_PLAYERS is what the demo sets: a run that is supposed to cover the whole title has to be
    # run against a title of that size, or the second run imports the next page of players and the
    # "second run writes nothing" assertion is asking about a different set of people.
    command: ["-addr=:8080", "-players=${LAB_PLAYERS:-10000}", "-seed=7"]
    healthcheck:
      # Not `/faketenant -h`: there is no shell in the image, and the flag parser exits 2 on -h, so
      # that healthcheck would report a healthy title as unhealthy forever.
      test: ["CMD", "/faketenant", "-addr=:8080", "-healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  nakama:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    # Nakama needs its schema before it will start: without the migrate step it dies on
    # `relation "migration_info" does not exist` and the lab looks like a broken image.
    #
    # The entrypoint is replaced, and that is not a detail: this image's entrypoint is
    # `tini -- /nakama/nakama`, so a `command:` of `sh -c ...` is passed to Nakama as arguments it
    # does not know. It ignores them and starts with its defaults - which point at a CockroachDB on
    # localhost, so the container exits a second later saying it cannot reach a database nobody
    # configured. tini is kept, and the server is exec'd, so signals reach the process that matters.
    entrypoint: ["tini", "--", "/bin/sh", "-c"]
    command:
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name mkit --database.address postgres:localdb@postgres:5432/nakama
        --session.token_expiry_sec 3600 --console.username admin --console.password adminpassword
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 60

  importer:
    build: .
    depends_on:
      nakama:
        condition: service_healthy
      faketenant:
        condition: service_healthy
    entrypoint: ["/importer"]
    # No command and no published port. The settings come from the environment because
    # `docker compose run <service> -limit=300` replaces the service's command rather than adding to
    # it, and a port published here is a port that will already be taken on somebody's machine - this
    # lab's console was published once, and it collided with a Nakama from an earlier spike.
    environment: &importenv
      MIGRATION_SOURCE: playfab
      MIGRATION_PLAYFAB_BASE_URL: http://faketenant:8080
      MIGRATION_PLAYFAB_TITLE: LAB
      PLAYFAB_SECRET_KEY: lab-secret
      MIGRATION_PROFILE: /profiles/faketenant.json
      MIGRATION_TARGET_URL: http://nakama:7350
      MIGRATION_DSN: postgres://postgres:localdb@postgres:5432/mkit?sslmode=disable
      MIGRATION_BATCH: "500"
      MIGRATION_CONCURRENCY: "4"

  # The gate on a cutover, in the same lab: it reads the source, reads the target, and exits non-zero
  # if the target does not account for the source.
  reconcile:
    build: .
    depends_on:
      nakama:
        condition: service_healthy
      faketenant:
        condition: service_healthy
    entrypoint: ["/reconcile"]
    environment: *importenv

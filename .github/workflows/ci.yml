name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The database tests are the interesting half of this kit: they are what proves an import writes
    # nothing the second time. They skip when MIGRATION_TEST_DSN is unset, so a CI without a server
    # would report green having run three quarters of the suite - the kind of green this repository
    # exists to avoid.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: mkit
          POSTGRES_DB: mkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MIGRATION_TEST_DSN: postgres://postgres:mkit@127.0.0.1:5432/mkit?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go build ./...
      - run: go test -race -count=1 ./...

  # The plugin is a deliverable and its failure mode is a version mismatch that does not show up at
  # build time on this machine: it is built by the plugin builder image and loaded into a real
  # Nakama, which is what this job does. A module that does not register its RPCs fails here.
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/runtime-smoke.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: gofmt -l . | tee /dev/stderr | wc -l | grep -q '^0$'
      - run: go vet ./...

  # The kit's own image, run rather than inspected: it is distroless, it refuses to start without a
  # database, and the fake title's binary is in it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/image.sh

  # Lint, every branch rendered, and the manifests validated. A chart whose only tested path is the
  # default one has an untested path for every value a user sets.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: ./scripts/chart-check.sh

  # The whole thing, from nothing, the way the README describes it: a legacy title, a Nakama, an
  # import, a second import that writes nothing, and a reconciliation that agrees.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: PLAYERS=500 ./scripts/demo.sh
